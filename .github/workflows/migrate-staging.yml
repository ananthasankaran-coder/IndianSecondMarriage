name: Apply database migrations (STAGING)
# Actions tab -> "Apply database migrations (STAGING)" -> Run workflow.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  (Supabase account -> Access Tokens)
#   SUPABASE_DB_PASSWORD   (the database password chosen when creating rdp-staging)
# This workflow is hard-wired to the staging project. Production gets its own workflow later.
on: workflow_dispatch
permissions:
  contents: read
env:
  STAGING_PROJECT_REF: scmnrgkarkqatbavihej
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to staging project
        run: supabase link --project-ref "$STAGING_PROJECT_REF"
      - name: Show pending migrations
        run: supabase migration list --remote
      - name: Apply migrations
        run: supabase db push --remote --yes
