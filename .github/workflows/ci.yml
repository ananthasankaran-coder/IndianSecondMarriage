name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rdp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund  # switch back to `npm ci` once package-lock.json is committed
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - name: RLS and migration tests (throwaway Postgres + Supabase shim)
        run: bash scripts/test-rls.sh
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rdp_test
      - name: Production build
        run: npm run build
        env:
          APP_ENV: local
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund  # switch back to `npm ci` once package-lock.json is committed
      - run: npm audit --audit-level=high
