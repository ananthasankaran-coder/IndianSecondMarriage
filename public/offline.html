<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#fbfaf7;color:#1f2a37;margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px}
    main{max-width:28rem}
    h1{font-size:1.5rem;margin:0 0 .5rem}
    p{color:#4b5563;line-height:1.5}
    button{margin-top:1rem;padding:.75rem 1.25rem;border-radius:.5rem;border:0;background:#2f5f58;color:#fff;font-size:1rem}
    button:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
  </style>
</head>
<body>
  <main id="main">
    <h1>You're offline</h1>
    <p>We couldn't reach the internet. Your information is safe. Please check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
