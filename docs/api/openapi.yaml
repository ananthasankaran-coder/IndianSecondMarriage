openapi: 3.1.0
info:
  title: Relationship Discovery Platform API
  version: 0.0.1
  description: |
    Versioned REST API (handbook §10). Every response uses a stable envelope and carries an
    `x-correlation-id` header. Error codes are a public contract: they are only ever added, never renamed.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Liveness probe (reveals no configuration or data)
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          headers:
            x-correlation-id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId: { type: string }
        nextCursor: { type: [string, "null"] }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data:
          type: object
          required: [status]
          properties: { status: { const: ok } }
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, FEATURE_DISABLED, NOT_FOUND, CONFLICT,
             IDEMPOTENCY_CONFLICT, RATE_LIMITED, INTERNAL, SERVICE_UNAVAILABLE]
    ErrorResponse:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [issue]
                properties: { field: { type: string }, issue: { type: string } }
        meta: { $ref: "#/components/schemas/Meta" }
